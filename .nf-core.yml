lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-lrsomatic_logo_light.png
    - docs/images/nf-core-lrsomatic_logo_light.png
    - docs/images/nf-core-lrsomatic_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/CONTRIBUTING.md
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-lrsomatic_logo_light.png
    - docs/images/nf-core-lrsomatic_logo_light.png
    - docs/images/nf-core-lrsomatic_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/workflows/branch.yml
    - .github/workflows/linting.yml
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  # a -preview run publishes nothing, so this test asserts on the workflow graph instead of a versions.yml snapshot;
  # aligned_format is a -stub wiring test that asserts on the published file names (versions are snapshotted by default);
  # kinetics_pairing is a -stub regression test of the pairing joins: it asserts on the task trace and published reports
  nf_test_content:
    - tests/samplesheet_replicates.nf.test # -stub: launch-time samplesheet errors; asserts on the task trace, no snapshot
    - tests/sv_annotation_compose.nf.test
    - tests/aligned_format.nf.test
    - tests/kinetics_pairing.nf.test
nf_core_version: 4.2.2
repository_type: pipeline
template:
  author: Robert Forsyth & Luuk Harbers
  description: Workflow for somatic variant calling of long read data
  force: false
  is_nfcore: false
  name: lrsomatic
  org: IntGenomicsLab
  outdir: .
  skip_features:
    - fastqc
  version: 1.2.0dev
