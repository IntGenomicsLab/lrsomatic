lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-lrsomatic_logo_light.png
    - docs/images/nf-core-lrsomatic_logo_light.png
    - docs/images/nf-core-lrsomatic_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/CONTRIBUTING.md
  files_unchanged:
    # Exempt: carries `assets/lrsomatic_report/** linguist-vendored`, which keeps the
    # vendored tool source out of GitHub's language statistics
    - .gitattributes
    - CODE_OF_CONDUCT.md
    - assets/nf-core-lrsomatic_logo_light.png
    - docs/images/nf-core-lrsomatic_logo_light.png
    - docs/images/nf-core-lrsomatic_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/workflows/branch.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
  multiqc_config:
    - report_comment
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
nf_core_version: 4.0.2
repository_type: pipeline
template:
  author: Robert Forsyth & Luuk Harbers
  description: Workflow for somatic variant calling of long read data
  force: false
  is_nfcore: false
  name: lrsomatic
  org: IntGenomicsLab
  outdir: .
  skip_features:
    - fastqc
  version: 1.1.0
