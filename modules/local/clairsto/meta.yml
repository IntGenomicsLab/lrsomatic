# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "clairsto"
description: ClairS-TO is a deep-learning method for long-read tumor-only somatic small variant calling
keywords:
  - somatic
  - small
  - variant
  - SNV
  - indel
  - tumor-only
  - long-read
tools:
  - "clairsto":
      description: "ClairS-TO is a deep-learning method for long-read tumor-only somatic small variant calling"
      homepage: "https://github.com/HKU-BAL/ClairS-TO"
      documentation: "https://github.com/HKU-BAL/ClairS-TO"
      tool_dev_url: "https://github.com/HKU-BAL/ClairS-TO"
      doi: "10.1038/s41467-025-64547-z"
      licence: ["BSD-3-clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
    - tumor_bam:
        type: file
        description: |
          BAM file for tumor sample
        pattern: "*.bam"
    - tumor_bai:
        type: file
        description: |
          index file for tumor BAM file
        pattern: "*.bai"
    - model:
        type: string
        description: |
          Name for ClairS-TO model (platform: ont or hifi)
    - pon_vcfs:
        type: file
        description: |
          One or more panel of normals VCF files, passed to --panel_of_normals. Supplying these
          replaces the assembly-specific default list inside the image rather than adding to it.
        pattern: "*.vcf.gz"
    - pon_flags:
        type: list
        description: |
          Population allele matching flag ("True"/"False") for each panel of normals VCF, in the
          same order. Must have exactly one entry per VCF.
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
    - reference:
        type: file
        description: |
          Reference genome fasta file
        pattern: "*.{fasta,fa,fna}"
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference index information
    - index:
        type: file
        description: |
          Reference genome fasta index file
        pattern: "*.fai"
  - - meta4:
        type: map
        description: |
          Groovy Map containing CNA resource information
    - cna_resources:
        type: directory
        description: |
          Verdict CNA resource directory for the assembly the tumour BAM was aligned to, holding
          loci_files/, allele_files/ and a single GC_*.txt, and optionally an RT_*.txt. Passed as
          --cna_resource_dir. Supply [] to fall back to the GRCh38 set shipped inside the image.
          A set whose loci cannot belong to the reference given with --ref_fn makes ClairS-TO
          disable Verdict with a warning rather than apply the wrong coordinates.

output:
  indel_vcf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "indel.vcf.gz":
        type: file
        description: Indel somatic variants VCF file
        pattern: "indel.vcf.gz"
  indel_tbi:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "indel.vcf.gz.tbi":
        type: file
        description: Indel VCF index file
        pattern: "indel.vcf.gz.tbi"
  snv_vcf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "snv.vcf.gz":
        type: file
        description: SNV somatic variants VCF file
        pattern: "snv.vcf.gz"
  snv_tbi:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "snv.vcf.gz.tbi":
        type: file
        description: SNV VCF index file
        pattern: "*.vcf.gz.tbi"
  purity_ploidy:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "*_Tumor_Purity_Ploidy.txt":
        type: file
        description: |
          Tumour purity and ploidy Verdict estimated and tagged from, lifted out of ClairS-TO's
          work directory. Only written when Verdict ran inside ClairS-TO and reached a solution.
        pattern: "*_Tumor_Purity_Ploidy.txt"
  cna:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "*_Tumor_CNA.txt":
        type: file
        description: |
          Allele-specific copy number segments Verdict tagged from, lifted out of ClairS-TO's
          work directory. Only written when Verdict ran inside ClairS-TO and reached a solution.
        pattern: "*_Tumor_CNA.txt"
  versions_clairsto:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - clairsto:
          type: string
          description: The tool name
      - "run_clairs_to  --version |& sed '1!d ; s/run_clairs_to //'":
          type: string
          description: The command used to generate the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - clairsto:
          type: string
          description: The tool name
      - "run_clairs_to  --version |& sed '1!d ; s/run_clairs_to //'":
          type: string
          description: The command used to generate the version of the tool

authors:
  - "@robert-a-forsyth"
maintainers:
  - "@robert-a-forsyth"
