# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "clairsto"
description: ClairS-TO is a deep-learning method for long-read tumor-only somatic small variant calling
keywords:
  - somatic
  - small
  - variant
  - SNV
  - indel
  - tumor-only
  - long-read
tools:
  - "clairsto":
      description: "ClairS-TO is a deep-learning method for long-read tumor-only somatic small variant calling"
      homepage: "https://github.com/HKU-BAL/ClairS-TO"
      documentation: "https://github.com/HKU-BAL/ClairS-TO"
      tool_dev_url: "https://github.com/HKU-BAL/ClairS-TO"
      doi: "10.1038/s41467-025-64547-z"
      licence: ["BSD-3-clause"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
    - tumor_bam:
        type: file
        description: |
          BAM file for tumor sample
        pattern: "*.bam"
    - tumor_bai:
        type: file
        description: |
          index file for tumor BAM file
        pattern: "*.bai"
    - model:
        type: string
        description: |
          Name for ClairS-TO model (platform: ont or hifi)
    - pon_vcfs:
        type: file
        description: |
          Panel of normals / population allele database VCF files
        pattern: "*.vcf.gz"
    - pon_flags:
        type: string
        description: |
          One allele-matching flag per PON VCF ("True" for a population allele database,
          "False" for an artefact panel)
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
    - reference:
        type: file
        description: |
          Reference genome fasta file
        pattern: "*.{fasta,fa,fna}"
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference index information
    - index:
        type: file
        description: |
          Reference genome fasta index file
        pattern: "*.fai"
  - - cna_resources:
        type: directory
        description: |
          Resource directory for ClairS-TO's Verdict module (--cna_resource_dir), matching the
          reference build in use. Empty ([]) uses the GRCh38 resources bundled in the image.
        pattern: "clairsto_cna_resources"

output:
  indel_vcf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "indel.vcf.gz":
        type: file
        description: Indel somatic variants VCF file
        pattern: "indel.vcf.gz"
  indel_tbi:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "indel.vcf.gz.tbi":
        type: file
        description: Indel VCF index file
        pattern: "indel.vcf.gz.tbi"
  snv_vcf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "snv.vcf.gz":
        type: file
        description: SNV somatic variants VCF file
        pattern: "snv.vcf.gz"
  snv_tbi:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "snv.vcf.gz.tbi":
        type: file
        description: SNV VCF index file
        pattern: "*.vcf.gz.tbi"
  verdict_log:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
    - "*_verdict.log":
        type: file
        description: ClairS-TO Verdict (copy-number germline tagging) log, kept as QC
        pattern: "*_verdict.log"
  verdict_purity:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
    - "*_verdict_purity_ploidy.txt":
        type: file
        description: Tumor purity and ploidy estimated by Verdict, kept as QC
        pattern: "*_verdict_purity_ploidy.txt"
  versions_clairsto:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - clairsto:
          type: string
          description: The tool name
      - "/opt/bin/run_clairs_to --version |& sed '1!d ; s/run_clairs_to //'":
          type: string
          description: The command used to generate the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - clairsto:
          type: string
          description: The tool name
      - "/opt/bin/run_clairs_to --version |& sed '1!d ; s/run_clairs_to //'":
          type: string
          description: The command used to generate the version of the tool

authors:
  - "@robert-a-forsyth"
maintainers:
  - "@robert-a-forsyth"
