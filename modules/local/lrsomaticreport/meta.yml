# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "lrsomaticreport"
description: Render a self-contained per-sample HTML report from the pipeline's final outputs with the lrsomatic_report R/Quarto tool. All file inputs are optional and accept `[]`.
keywords:
  - report
  - quarto
  - somatic
  - long-read
tools:
  - "lrsomatic_report":
      description: "Standalone R/Quarto reporting tool for the LRSomatic pipeline"
      homepage: "https://github.com/ljwharbers/lrsomatic_report"
      documentation: "https://github.com/ljwharbers/lrsomatic_report/blob/main/README.md"
      tool_dev_url: "https://github.com/ljwharbers/lrsomatic_report"
      doi: ""
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information, e.g. `[ id:'sample1', paired_data:true, sex:'female' ]`.
          paired_data picks the report's run mode (`--run-mode paired`, else `tumour_only`); sex its `--sex`
    - vep_somatic:
        type: file
        description: VEP-annotated somatic small-variant VCF (SOMATIC_VEP output)
        pattern: "*_SOMATIC_VEP.vcf.gz"
    - sv_vep:
        type: file
        description: VEP-annotated structural-variant VCF (SV_VEP output)
        pattern: "*_SV_VEP.vcf.gz"
    - severus_vcf:
        type: file
        description: Severus somatic structural-variant VCF (circos tracks)
        pattern: "severus_somatic.vcf.gz"
    - somatic_vcf:
        type: file
        description: Phased somatic small-variant VCF; source of the VAF, depth and phase-set columns
        pattern: "*.vcf.gz"
    - ascat_files:
        type: file
        description: Collected ASCAT output files (segments_raw, purityploidy, diagnostic PNGs)
    - qc_tumor_files:
        type: file
        description: Collected tumor QC files (mosdepth summary/dist, cramino, samtools stats/flagstat) plus the sample's WhatsHap phasing statistics (`*_whatshap_stats.tsv`, from the phased germline VCF)
    - qc_normal_files:
        type: file
        description: Collected normal-sample QC files (matched mode only)
    - extra_relpaths:
        type: list
        description: |
          Relative path under the tool's sample directory for each entry of `extra_files`, in the same order, mirroring
          the published `<outdir>/<sample>/` layout (e.g. `padfoot/savana/by_gene.tsv`). Must be unique and relative;
          `[]` when there are none
    - extra_files:
        type: file
        description: |
          Every other output the report reads (SigProfiler, ShatterSeek, ecDNA, SAVANA, Padfoot,
          ReConPlot PNGs, Wakhan's ranked solutions and top-ranked BEDs), one file per `extra_relpaths` entry. Each stages
          in its own numbered directory, so files sharing a base name do not collide; `[]` when there are none
  - - gene_lists:
        type: directory
        description: Builtin gene panel TSVs from `assets/gene_lists` (`<name>.tsv` or a `<name>.hg38.tsv` / `<name>.t2t.tsv` pair), passed as `--gene-lists-dir` and replacing the container's set
  - - gene_panels:
        type: file
        description: User-supplied gene panel TSVs (each with a `gene` column) applied on load; unioned when several are given, and base names must be unique
        pattern: "*.tsv"
  - - hmf_driver_panel:
        type: file
        description: HMF `DriverGenePanel.38.tsv` (oncoanalyser resource bundle: GRCh38, or its CHM13 lift from HMF_LIFTOVER); turns on the HMF driver annotation section. `[]` when off
        pattern: "*.tsv"
    - hmf_ensembl_data:
        type: directory
        description: HMF Ensembl data cache (`common/ensembl_data`, with `ensembl_gene_data.csv` and `ensembl_trans_exon_data.csv`); required with the driver panel. `[]` when off
    - hmf_known_fusions:
        type: file
        description: HMF `known_fusion_data.38.csv`, for known-fusion matching of the SV calls; optional, `[]` when absent
        pattern: "*.csv"
    - hmf_hotspots:
        type: file
        description: HMF `KnownHotspots.somatic.38.vcf.gz`, for hotspot matching of small variants; optional, `[]` when absent
        pattern: "*.vcf.gz"
    - hmf_actionable_bed:
        type: file
        description: HMF `ActionableCodingPanel.38.bed(.gz)`, a region flag on small variants; optional (absent from bundle v3), `[]` when absent
        pattern: "*.bed{,.gz}"

output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*_report.html":
          type: file
          description: Self-contained per-sample HTML report
          pattern: "*_report.html"
  small_variants:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*_small_variants.tsv.gz":
          type: file
          description: Full small-variant table behind the report's variant section, written whenever a somatic VEP file is given
          pattern: "*_small_variants.tsv.gz"
  staged:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "staged.txt":
          type: file
          description: Stub only, for the tests -- every file under the tool's sample directory with the md5 of its content
          pattern: "staged.txt"
  versions_lrsomaticreport:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "lrsomatic_report":
          type: string
          description: The name of the tool
      - "env -u R_HOME render_report.R --version":
          type: string
          description: The command used to generate the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - lrsomatic_report:
          type: string
          description: The name of the tool
      - "env -u R_HOME render_report.R --version":
          type: string
          description: The command used to generate the version of the tool

authors:
  - "@ljwharbers"
maintainers:
  - "@ljwharbers"
