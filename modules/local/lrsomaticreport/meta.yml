# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "lrsomaticreport"
description: Render a self-contained per-sample HTML report from the pipeline's final outputs with the lrsomatic_report R/Quarto tool. All file inputs are optional and accept `[]`.
keywords:
  - report
  - quarto
  - somatic
  - long-read
tools:
  - "lrsomatic_report":
      description: "Standalone R/Quarto reporting tool for the LRSomatic pipeline"
      homepage: "https://github.com/ljwharbers/lrsomatic_report"
      documentation: "https://github.com/ljwharbers/lrsomatic_report/blob/main/README.md"
      tool_dev_url: "https://github.com/ljwharbers/lrsomatic_report"
      doi: ""
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - vep_somatic:
        type: file
        description: VEP-annotated somatic small-variant VCF (SOMATIC_VEP output)
        pattern: "*_SOMATIC_VEP.vcf.gz"
    - sv_vep:
        type: file
        description: VEP-annotated structural-variant VCF (SV_VEP output)
        pattern: "*_SV_VEP.vcf.gz"
    - severus_vcf:
        type: file
        description: Severus somatic structural-variant VCF (circos tracks)
        pattern: "severus_somatic.vcf.gz"
    - somatic_vcf:
        type: file
        description: Phased somatic small-variant VCF; source of the VAF, depth and phase-set columns
        pattern: "*.vcf.gz"
    - ascat_files:
        type: file
        description: Collected ASCAT output files (segments_raw, purityploidy, diagnostic PNGs)
    - qc_tumor_files:
        type: file
        description: Collected tumor QC files (mosdepth summary/dist, cramino, samtools stats/flagstat)
    - qc_normal_files:
        type: file
        description: Collected normal-sample QC files (matched mode only)
    - wakhan_files:
        type: file
        description: Collected Wakhan outputs (solutions_ranks.tsv, heatmap HTML, `solution_<rank>/` directories)
  - - gene_lists:
        type: directory
        description: Builtin gene panel TSVs from `assets/gene_lists` (`<name>.tsv` or a `<name>.hg38.tsv` / `<name>.t2t.tsv` pair), passed as `--gene-lists-dir` and replacing the container's set
  - - gene_panels:
        type: file
        description: User-supplied gene panel TSVs (each with a `gene` column) applied on load; unioned when several are given, and base names must be unique
        pattern: "*.tsv"

output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*_report.html":
          type: file
          description: Self-contained per-sample HTML report
          pattern: "*_report.html"
  versions_lrsomaticreport:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "lrsomatic_report":
          type: string
          description: The name of the tool
      - "env -u R_HOME render_report.R --version":
          type: string
          description: The command used to generate the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - lrsomatic_report:
          type: string
          description: The name of the tool
      - "env -u R_HOME render_report.R --version":
          type: string
          description: The command used to generate the version of the tool

authors:
  - "@ljwharbers"
maintainers:
  - "@ljwharbers"
