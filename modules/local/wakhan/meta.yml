---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "wakhan"
description: A tool to analyze haplotype-specific chromosome-scale somatic copy number aberrations and aneuploidy using long reads
keywords:
  - copy-number
  - aneuploidy
  - somatic
  - haplotype-specific
  - long-read
  - structural-variation
tools:
  - "wakhan":
      description: "A tool to analyze haplotype-specific chromosome-scale somatic copy number aberrations and aneuploidy using long reads (Oxford Nanopore, PacBio)"
      homepage: "https://github.com/KolmogorovLab/Wakhan"
      documentation: "https://github.com/KolmogorovLab/Wakhan"
      tool_dev_url: "https://github.com/KolmogorovLab/Wakhan"
      doi: "10.64898/2025.12.11.25342098v1"
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - tumor_input:
        type: file
        description: Tumor BAM file
        pattern: "*.bam"
    - tumor_index:
        type: file
        description: Tumor BAM index file
        pattern: "*.bai"
    - normal_input:
        type: file
        description: Normal BAM file (optional)
        pattern: "*.bam"
    - normal_index:
        type: file
        description: Normal BAM index file (optional)
        pattern: "*.bai"
    - vcf:
        type: file
        description: Phased VCF file
        pattern: "*.vcf.gz"
    - breakpoints:
        type: file
        description: Breakpoints file from structural variant caller
        pattern: "*.{bed,vcf}"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
    - reference:
        type: file
        description: Reference genome fasta file
        pattern: "*.{fasta,fa,fna}"

output:
  integer_profile_html:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solution_*_*_*/integer_profile.html":
        type: file
        description: Per-solution integer copy-number profile plot (HTML)
        pattern: "solution_*_*_*/integer_profile.html"
  integer_profile_pdf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solution_*_*_*/integer_profile.pdf":
        type: file
        description: Per-solution integer copy-number profile plot (PDF)
        pattern: "solution_*_*_*/integer_profile.pdf"
  integer_profile:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solution_*_*_*/integer_profile.{bed,vcf}":
        type: file
        description: Per-solution integer copy-number segments, both haplotypes boundary-aligned (BED and VCF)
        pattern: "solution_*_*_*/integer_profile.{bed,vcf}"
  subclonal_profile_html:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solution_*_*_*/subclonal_profile.html":
        type: file
        description: Per-solution subclonal copy-number profile plot (HTML)
        pattern: "solution_*_*_*/subclonal_profile.html"
  subclonal_profile_pdf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solution_*_*_*/subclonal_profile.pdf":
        type: file
        description: Per-solution subclonal copy-number profile plot (PDF)
        pattern: "solution_*_*_*/subclonal_profile.pdf"
  subclonal_profile:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solution_*_*_*/subclonal_profile.{bed,vcf}":
        type: file
        description: Per-solution subclonal copy-number segments (BED and VCF)
        pattern: "solution_*_*_*/subclonal_profile.{bed,vcf}"
  genes:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solution_*_*_*/genes/genes_copynumber_states.*":
        type: file
        description: Per-solution gene copy-number states (BED, HTML and PDF)
        pattern: "solution_*_*_*/genes/genes_copynumber_states.*"
  hiscanner_zip:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solution_*_*_*/HiScanner_plots_data.zip":
        type: file
        description: Per-solution bundle for the Wakhan visualisation web viewer
        pattern: "solution_*_*_*/HiScanner_plots_data.zip"
  heatmap_html:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "*_heatmap_ploidy_purity.html":
        type: file
        description: Ploidy/purity heatmap (HTML)
        pattern: "*_heatmap_ploidy_purity.html"
  heatmap_pdf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "*_heatmap_ploidy_purity.html.pdf":
        type: file
        description: Ploidy/purity heatmap (PDF)
        pattern: "*_heatmap_ploidy_purity.html.pdf"
  coverage_csv:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "coverage_data/*.csv":
        type: file
        description: Coverage, BAF and SNP tables
        pattern: "coverage_data/*.csv"
  coverage_png:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "coverage_data/*.png":
        type: file
        description: Copy-number coverage and peak plots
        pattern: "coverage_data/*.png"
  coverage_plots_html:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "coverage_plots/*.html":
        type: file
        description: Per-chromosome coverage plots (HTML)
        pattern: "coverage_plots/*.html"
  coverage_plots_pdf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "coverage_plots/*.pdf":
        type: file
        description: Per-chromosome coverage plots (PDF)
        pattern: "coverage_plots/*.pdf"
  phasing_html:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "phasing_output/*.html":
        type: file
        description: Phase-correction plots (HTML)
        pattern: "phasing_output/*.html"
  phasing_pdf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "phasing_output/*.pdf":
        type: file
        description: Phase-correction plots (PDF)
        pattern: "phasing_output/*.pdf"
  rephased_vcf:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "phasing_output/*rephased.vcf.gz":
        type: file
        description: Phase-corrected VCF
        pattern: "phasing_output/*rephased.vcf.gz"
  rephased_vcf_index:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "phasing_output/*rephased.vcf.gz.csi":
        type: file
        description: Index of the phase-corrected VCF
        pattern: "phasing_output/*rephased.vcf.gz.csi"
  snps_loh_plot:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "snps_loh_plots/*_genome_snps_ratio_loh.html":
        type: file
        description: SNP ratio / LOH plot (tumour-only runs)
        pattern: "snps_loh_plots/*_genome_snps_ratio_loh.html"
  solutions_ranks:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solutions_ranks.tsv":
        type: file
        description: Ranked ploidy/purity solutions
        pattern: "solutions_ranks.tsv"
  solution_dirs:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - "solution_rank_*":
        type: directory
        description: Ranked solution directories (links to solution_<ploidy>_<purity>_<confidence>)
  versions_wakhan:
    - - ${task.process}:
          type: string
          description: The name of the process
      - wakhan:
          type: string
          description: The name of the tool
      - wakhan --version 2>/dev/null | sed 's/^wakhan //':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - wakhan:
          type: string
          description: The name of the tool
      - wakhan --version 2>/dev/null | sed 's/^wakhan //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@ljwharbers"
maintainers:
  - "@ljwharbers"
