---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "coral_seed"
description: Identify amplified intervals that seed CoRAL amplicon reconstruction.
keywords:
  - ecdna
  - amplicon
  - copy number
  - long-read
tools:
  - "coral":
      description: "Reconstructs extrachromosomal DNA structures from long-read sequencing."
      homepage: "https://github.com/AmpliconSuite/CoRAL"
      documentation: "https://github.com/AmpliconSuite/CoRAL"
      doi: "10.1101/gr.279131.124"
      licence: ["BSD-3-Clause"]
      identifier: ""

## No environment.yml: CoRAL is not on bioconda -- the `coral` recipe there is an unrelated
## RNA-seq read-bridging tool. The container is built from a fork adding T2T-CHM13 support
## (https://github.com/robert-a-forsyth/CoRAL, branch chm13-support), which also fixes two
## upstream bugs that made `--solver scip` fail. See containers/coral.Dockerfile.

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - cn_seg:
        type: file
        description: Copy-number segments with total CN in the last column
        pattern: "*.{bed,cns}"
    - bam:
        type: file
        description: Tumour BAM; CoRAL reads chromosome sizes from its header
        pattern: "*.bam"
    - bai:
        type: file
        description: BAM index
        pattern: "*.bai"
  - - coral_ref:
        type: string
        description: Reference genome name, one of hg19, hg38, mm10, t2t

output:
  seeds:
    - meta:
        type: map
        description: Groovy Map containing sample information
    - "*_CNV_SEEDS.bed":
        type: file
        description: Amplified seed intervals; empty when nothing exceeds --gain
        pattern: "*_CNV_SEEDS.bed"
  versions_coral:
    - - ${task.process}:
          type: string
          description: Process name
      - coral:
          type: string
          description: Tool name
      - version:
          type: string
          description: Tool version

topics:
  versions:
    - - ${task.process}:
          type: string
          description: Process name
      - coral:
          type: string
          description: Tool name
      - version:
          type: string
          description: Tool version

authors:
  - "@robert-a-forsyth"
maintainers:
  - "@robert-a-forsyth"
