name: bcftools_caller_union
description: Union of two callers' VCFs with one record per position (CHROM:POS), preferring PASS records and then the priority caller
keywords:
  - union
  - VCF
  - positions
tools:
  - view:
      description: VCF/BCF conversion, view, subset and filter VCF/BCF files.
      homepage: http://samtools.github.io/bcftools/bcftools.html
      documentation: http://www.htslib.org/doc/bcftools.html
      tool_dev_url: https://github.com/samtools/bcftools
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]
      identifier: biotools:bcftools
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information e.g. [ id:'test' ]
    - prio_vcf:
        type: file
        description: VCF of the priority caller
        pattern: "*.vcf.gz"
    - prio_tbi:
        type: file
        description: Tabix index of the priority caller's VCF
        pattern: "*.tbi"
    - other_vcf:
        type: file
        description: VCF of the other caller
        pattern: "*.vcf.gz"
    - other_tbi:
        type: file
        description: Tabix index of the other caller's VCF
        pattern: "*.tbi"
output:
  vcf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}.vcf.gz:
          type: file
          description: Union VCF, one record per position
          pattern: "*.vcf.gz"
  tbi:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}.vcf.gz.tbi:
          type: file
          description: Tabix index of the output VCF
          pattern: "*.tbi"
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
          type: string
          description: The tool name
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
          type: string
          description: The tool name
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@robert-a-forsyth"
maintainers:
  - "@robert-a-forsyth"
