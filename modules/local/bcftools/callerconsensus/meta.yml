name: bcftools_caller_consensus
description: Consensus of two callers' VCFs - the priority caller's own records whose called alleles (those in the genotype) are all called by the other caller
keywords:
  - consensus
  - intersection
  - VCF
  - genotype
tools:
  - view:
      description: VCF/BCF conversion, view, subset and filter VCF/BCF files.
      homepage: http://samtools.github.io/bcftools/bcftools.html
      documentation: http://www.htslib.org/doc/bcftools.html
      tool_dev_url: https://github.com/samtools/bcftools
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]
      identifier: biotools:bcftools
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information e.g. [ id:'test' ]
    - prio_vcf:
        type: file
        description: VCF of the priority caller
        pattern: "*.vcf.gz"
    - prio_tbi:
        type: file
        description: Tabix index of the priority caller's VCF
        pattern: "*.tbi"
    - other_vcf:
        type: file
        description: VCF of the other caller
        pattern: "*.vcf.gz"
    - other_tbi:
        type: file
        description: Tabix index of the other caller's VCF
        pattern: "*.tbi"
  - - meta2:
        type: map
        description: Groovy Map containing reference information e.g. [ id:'genome' ]
    - fasta:
        type: file
        description: Reference FASTA, used to left-align the split alleles
        pattern: "*.{fa,fasta,fna}"
  - - meta3:
        type: map
        description: Groovy Map containing reference information e.g. [ id:'genome' ]
    - fai:
        type: file
        description: Index of the reference FASTA
        pattern: "*.fai"
output:
  vcf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}.vcf.gz:
          type: file
          description: Consensus VCF, the priority caller's records unchanged
          pattern: "*.vcf.gz"
  tbi:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - ${prefix}.vcf.gz.tbi:
          type: file
          description: Tabix index of the output VCF
          pattern: "*.tbi"
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
          type: string
          description: The tool name
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
          type: string
          description: The tool name
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@ljwharbers"
maintainers:
  - "@ljwharbers"
