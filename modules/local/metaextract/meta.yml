---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "metaextract"
description: Extract basecall model and kinetics metadata from BAM/CRAM file headers, and check whether an aligned CRAM can be decoded with the pipeline reference
keywords:
  - metadata
  - bam
  - header
  - basecall
  - kinetics
  - long-read
tools:
  - "samtools":
      description: "Tools for manipulating next-generation sequencing data"
      homepage: "http://www.htslib.org/"
      documentation: "http://www.htslib.org/doc/samtools.html"
      tool_dev_url: "https://github.com/samtools/samtools"
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]
      identifier: biotools:samtools

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - bam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: "http://edamontology.org/format_25722"
          - edam: "http://edamontology.org/format_2573"
          - edam: "http://edamontology.org/format_3462"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'fasta' ]`
    - fasta:
        type: file
        description: |
          Reference FASTA (may be gzipped) for CRAM input, used only to compare its
          contig checksums with the CRAM's @SQ M5 tags; `[]` for BAM input
        pattern: "*.{fa,fasta,fna,fa.gz,fasta.gz,fna.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1929"

output:
  meta_ext:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - env(basecall_model):
        type: string
        description: Basecall model extracted from BAM header
    - env(kinetics):
        type: string
        description: Kinetics information extracted from BAM header
  decode_with_fasta:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - env(decode_with_fasta):
        type: string
        description: |
          'true' when the input is an aligned CRAM sharing no contig name with `fasta`
          under a different M5, so it may be decoded with `fasta`; 'false' otherwise
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - samtools:
          type: string
          description: The tool name
      - "samtools version | sed '1!d;s/.* //'":
          type: string
          description: The command used to generate the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - samtools:
          type: string
          description: The tool name
      - "samtools version | sed '1!d;s/.* //'":
          type: string
          description: The command used to generate the version of the tool

authors:
  - "@robert-a-forsyth"
maintainers:
  - "@robert-a-forsyth"
