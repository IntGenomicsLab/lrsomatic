report_comment: >
  This report has been generated by the <a href="https://github.com/IntGenomicsLab/lrsomatic/tree/dev" target="_blank">IntGenomicsLab/lrsomatic</a> analysis pipeline.
report_section_order:
  "IntGenomicsLab-lrsomatic-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "IntGenomicsLab-lrsomatic-summary":
    order: -1002

export_plots: true

# Post-alignment NanoPlot files are named <sample>_<type>_aln_NanoStats.txt. Dropping that "_aln"
# puts their NanoStat row on the same <sample>_<type> row as samtools and mosdepth for that BAM.
extra_fn_clean_exts:
  - type: regex
    pattern: "_aln(?=_NanoStats)"
    module: nanostat

# samtools stats on long reads writes 70+ MB files (its read-length and coverage histograms run to
# the longest read and deepest base). MultiQC silently skips any file above log_filesize_limit,
# whose default is 50 MB, so the samtools stats section would only ever cover small files.
log_filesize_limit: 500000000

disable_version_detection: true
